[workspace]
resolver = "2"
members = [
    "crates/sunbeam-meet-proto",
    "crates/sunbeam-meet-server",
    "crates/sunbeam-meet-migrations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://src.sunbeam.pt/studio/sunbeam-meet"
authors = ["Sunbeam Studios"]
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Routinely-allowed pedantic lints (noise in a service codebase):
module_name_repetitions = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }             # brand names (LiveKit, Kratos, …) trigger this
cast_precision_loss = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
unused_async = { level = "allow", priority = 1 }             # keeping async on handlers for trait uniformity
used_underscore_binding = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
fn_params_excessive_bools = { level = "allow", priority = 1 }

# tonic::Status is 176 bytes; boxing every handler Result is not worth it.
result_large_err = { level = "allow", priority = 1 }

[workspace.dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# RPC / HTTP — connect-rust served alongside tonic on the same port
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-web = "0.12"
tonic-build = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
# connect-rust — implementer wires the exact crate name + version.
# See https://github.com/anthropics/connect-rust
axum = { version = "0.7", features = ["http2", "macros"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "compression-gzip"] }
http = "1"
http-body-util = "0.1"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }

# Events
async-nats = "0.38"

# HTTP clients
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
percent-encoding = "2"

# Object storage (SeaweedFS via S3 API)
aws-config = "1"
aws-sdk-s3 = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "1"
anyhow = "1"

# IDs / time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# Auth / JWT
jsonwebtoken = "9"

# LiveKit — server admin SDK (rooms, egress, tokens, webhooks).
# Default features: services-tokio + access-token + webhooks, which covers
# every server-side surface we use. We pick `rustls-tls-webpki-roots` so we
# match the rest of the workspace's rustls choice (no native-tls dep creep).
livekit-api = { version = "0.4.18", default-features = false, features = [
    "services-tokio",
    "access-token",
    "webhooks",
    "rustls-tls-webpki-roots",
] }
# Protobuf types shared with `livekit-api` — needed to construct
# `EncodedFileOutput` / `S3Upload` when starting egress. Pinned to the same
# version `livekit-api` transitively depends on.
livekit-protocol = "0.7.4"

# LiveKit — RTC client SDK, dev-only. Used by integration tests to actually
# join a room, publish tracks, and assert on peer-connection state so
# composite egress has a publisher to record and `probe_join` is a real
# round-trip. Pulls libwebrtc at build time (prebuilt, not from source) —
# expect ~300MB download on first build.
livekit = { version = "0.7.36", default-features = false, features = [
    "tokio",
    "rustls-tls-webpki-roots",
] }

# Metrics
prometheus = "0.13"

# Rate limiting / misc
tower_governor = "0.4"
governor = "0.6"
bytes = "1"
base64 = "0.22"
hex = "0.4"
dashmap = "6"
sha2 = "0.10"

# Dev / tests
assert_matches = "1"
rstest = "0.23"
insta = { version = "1", features = ["json", "yaml"] }
tempfile = "3"
wiremock = "0.6"  # used ONLY for external HTTP APIs (Scaleway/Mistral) where we don't want to burn API quota in CI
proptest = "1"
