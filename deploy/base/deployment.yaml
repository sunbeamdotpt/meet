apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunbeam-meet
  labels:
    app.kubernetes.io/name: sunbeam-meet
    app.kubernetes.io/component: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sunbeam-meet
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunbeam-meet
        app.kubernetes.io/component: server
      annotations:
        # Restart pods when the ConfigMap changes.
        checksum/config: "replace-on-apply"
    spec:
      serviceAccountName: sunbeam-meet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: registry.sunbeam.pt/sunbeam-meet:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: rpc
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sunbeam-meet-config
          env:
            # Infrastructure endpoints + creds. The Secret itself is managed
            # outside this tree (see deploy/README.md).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: DATABASE_URL }
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: VALKEY_URL }
            - name: NATS_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: NATS_URL }
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: S3_ENDPOINT }
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: S3_SECRET_KEY }
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: S3_BUCKET }
            - name: CALDAV_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: CALDAV_URL }
            - name: CALDAV_USER
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: CALDAV_USER }
            - name: CALDAV_PASSWORD
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: CALDAV_PASSWORD }
            - name: KRATOS_PUBLIC_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: KRATOS_PUBLIC_URL }
            - name: KRATOS_ADMIN_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: KRATOS_ADMIN_URL }
            - name: KETO_READ_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: KETO_READ_URL }
            - name: KETO_WRITE_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: KETO_WRITE_URL }
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: LIVEKIT_URL }
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: LIVEKIT_API_KEY }
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: LIVEKIT_API_SECRET }
            - name: SCALEWAY_API_KEY
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: SCALEWAY_API_KEY }
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef: { name: sunbeam-meet-secrets, key: MISTRAL_API_KEY }
            # OTLP exporter target (studio observability stack).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "sunbeam-meet"
          livenessProbe:
            httpGet:
              path: /healthz
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: rpc
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sunbeam-meet
              app.kubernetes.io/component: server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sunbeam-meet
