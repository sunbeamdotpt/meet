# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2026.08.0)'
        required: true
        default: 'v2026.08.0'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  container:
    needs: resolve-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version tags
        id: version_tags
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR_REST="${VERSION#*.}"
          MINOR="${MINOR_REST%%.*}"
          echo "patch=${TAG}" >> "$GITHUB_OUTPUT"
          echo "minor=v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "major=v${MAJOR}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" != *-* ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version_tags.outputs.patch }}
            type=raw,value=${{ steps.version_tags.outputs.minor }}
            type=raw,value=${{ steps.version_tags.outputs.major }}
            type=raw,value=latest,enable=${{ steps.version_tags.outputs.latest == 'true' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SHOW_SETTINGS_MENU=true
            VERSION=${{ needs.resolve-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-tag.outputs.tag }}"

  plugin:
    needs: resolve-tag
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./plugins/livekit-meet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.18.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin bundle and zip
        run: pnpm build:zip ${{ needs.resolve-tag.outputs.tag }}

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: livekit-meet-plugin-${{ needs.resolve-tag.outputs.tag }}
          path: plugins/livekit-meet/livekit-meet-plugin-${{ needs.resolve-tag.outputs.tag }}.zip
          retention-days: 7

  release:
    needs: [resolve-tag, container, plugin]
    runs-on: ubuntu-24.04
    steps:
      - name: Download plugin zip artifact
        uses: actions/download-artifact@v4
        with:
          name: livekit-meet-plugin-${{ needs.resolve-tag.outputs.tag }}
          path: ./artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          files: ./artifacts/livekit-meet-plugin-${{ needs.resolve-tag.outputs.tag }}.zip
          generate_release_notes: true
