schema: 1
project:
  name: sunbeam-meet
  kind: rust-bin
  description: "LiveKit-backed video conferencing service (gRPC + Connect)."
targets:
  build:
    exec: "cargo build --release"
  test:
    exec: [cargo, nextest, run]
  lint:
    exec: "cargo clippy -- -D warnings"
  fmt:
    exec: "cargo fmt"
  clean:
    exec: "cargo clean"
  doc:
    exec: "cargo doc --no-deps"
  package:
    exec: "docker buildx build --push -t src.${SUNBEAM_REGISTRY}/studio/sunbeam-meet:latest ."
deps:
  services:
    - postgres
    - valkey
    - nats
    - livekit
    - seaweedfs
    - stalwart
    - keto
    - kratos
tenant:
  namespace: meet
  host: meet.sunbeam.pt
outputs:
  - target/release/sunbeam-meet-server
