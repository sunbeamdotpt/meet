# Ory Keto — minimal dev config for sunbeam-meet integration tests.
# Not for production use.

version: v26.2.0

dsn: sqlite:///tmp/keto.db?_fk=true&mode=rwc

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

namespaces:
  - id: 0
    name: room
  - id: 1
    name: recording
  - id: 2
    name: schedule

log:
  level: info
  format: text
