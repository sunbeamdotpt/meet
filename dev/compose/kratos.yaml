# Ory Kratos — minimal dev config for sunbeam-meet integration tests.
# Not for production use.

version: v26.2.0

dsn: sqlite:///tmp/kratos.db?_fk=true&mode=rwc

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  methods:
    password:
      enabled: true
  flows:
    login:
      ui_url: http://127.0.0.1:4455/login
    registration:
      ui_url: http://127.0.0.1:4455/registration

secrets:
  cookie:
    - devcookiesecretdevcookiesecretdev
  cipher:
    - devciphersecretdevciphersecretxx

session:
  lifespan: 24h

log:
  level: info
  format: text
