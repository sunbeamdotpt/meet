# Minimal Stalwart v0.15 config for CalDAV integration tests.
# Not for production. CalDAV/CardDAV ship on by default in v0.12+ once the
# HTTP listener is enabled and a directory/store is configured.

[server.listener.http]
protocol = "http"
bind = "[::]:8080"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

# Plain-text is accepted for fallback-admin; fine for an ephemeral dev box.
[authentication.fallback-admin]
user = "admin"
secret = "admin"

[tracer.stdout]
type = "stdout"
level = "warn"
ansi = false
enable = true
