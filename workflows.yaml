# sunbeam-meet — WFE CI/CD workflow
#
# TODO(release-engineer): VERIFY this file against the wfe-core schema before
# the first run. The shape below is modelled on estafeta's workflows.yaml and
# the tier structure codified in DESIGN.md §9, but the authoritative schema
# lives in `~/Development/sunbeam/wfe-core/`. If fields drift, adjust and open
# an issue against wfe-core so all studio repos can be updated together.
#
# Git hosting: src.sunbeam.pt (Gitea). Never GitHub.
# Runtime: WFE runners, not GitHub Actions.

apiVersion: wfe.sunbeam.pt/v1
kind: Workflow
metadata:
  name: sunbeam-meet
  namespace: wfe
  labels:
    team: sunbeam-meet
    project: sunbeam-meet
    language: rust

spec:
  # Default container for jobs that don't override.
  defaultImage: registry.sunbeam.pt/wfe/rust-ci:1.82-bookworm

  # ---- Triggers ----
  on:
    push:
      branches: [mainline]
    pullRequest:
      branches: [mainline]
    tag:
      # Semver release tags drive publish + image + release.
      patterns: ["v*"]

  # ---- Cache (cargo registry + target) ----
  cache:
    - key: "cargo-registry-{{ hashFiles('**/Cargo.lock') }}"
      paths:
        - ~/.cargo/registry
        - ~/.cargo/git
    - key: "cargo-target-{{ checksum 'Cargo.lock' }}"
      paths:
        - target

  # ---- Secrets ----
  # TODO(release-engineer): confirm bundle name with wfe-core. DESIGN.md §12
  # item 6 asks us to nail this down. The working assumption is that shared
  # sunbeam dev-service credentials are exposed under the secret
  # `SUNBEAM_DEV_SERVICES`, projected as env vars prefixed by service name
  # (DATABASE_URL, VALKEY_URL, NATS_URL, S3_*, CALDAV_*, KRATOS_*, KETO_*,
  # LIVEKIT_*, SCALEWAY_API_KEY, MISTRAL_API_KEY). Matches DESIGN §4's env-var
  # names so integration tests can consume them directly.
  secrets:
    - name: SUNBEAM_DEV_SERVICES
      mountAs: env
    - name: SUNBEAM_REGISTRY_TOKEN
      mountAs: env
      usedBy: [publish-proto, publish-migrations, image, release]
    - name: GITEA_RELEASE_TOKEN
      mountAs: env
      usedBy: [release]

  jobs:

    # ---- Tier 0: lint ----
    lint:
      needs: []
      steps:
        - name: fmt
          run: cargo fmt --all -- --check
        - name: clippy
          run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        - name: deny
          # TODO(release-engineer): drop the `if` once a deny.toml is committed
          # at the repo root. Until then the step is a no-op.
          if: "fileExists('deny.toml')"
          run: cargo deny check

    # ---- Tier 1: unit tests (no services) ----
    test-unit:
      needs: [lint]
      steps:
        - name: install-nextest
          run: cargo install cargo-nextest --locked
        - name: nextest
          run: cargo nextest run --profile default --workspace

    # ---- Tier 2: integration tests against real shared dev services ----
    # Per CLAUDE.md: no mocks for infra-facing code. These hit the real
    # shared sunbeam dev instances listed in DESIGN §4.
    test-integration:
      needs: [test-unit]
      # Pre-merge gate in the WFE model.
      gate: pre-merge
      env:
        RUST_LOG: info
        # The SUNBEAM_DEV_SERVICES secret bundle provides all of:
        #   DATABASE_URL, VALKEY_URL, NATS_URL,
        #   S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET,
        #   CALDAV_URL, CALDAV_USER, CALDAV_PASSWORD,
        #   KRATOS_PUBLIC_URL, KRATOS_ADMIN_URL,
        #   KETO_READ_URL, KETO_WRITE_URL,
        #   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
        #   SCALEWAY_API_KEY, MISTRAL_API_KEY
      steps:
        - name: install-nextest
          run: cargo install cargo-nextest --locked
        - name: migrate
          run: cargo run -p sunbeam-meet-migrations --release -- migrate
        - name: nextest
          run: cargo nextest run --profile integration --workspace

    # ---- Tier 3: coverage ----
    coverage:
      needs: [test-integration]
      steps:
        - name: install-llvm-cov
          run: cargo install cargo-llvm-cov --locked
        - name: install-nextest
          run: cargo install cargo-nextest --locked
        - name: cover
          run: |
            cargo llvm-cov nextest \
              --workspace \
              --profile integration \
              --fail-under-lines 85 \
              --lcov --output-path lcov.info
        - name: upload
          uses: wfe/artifact-upload@v1
          with:
            name: coverage
            path: lcov.info

    # ---- Publish proto crate (tier 1 of release cascade) ----
    publish-proto:
      needs: [coverage]
      if: "startsWith(ref, 'refs/tags/v')"
      steps:
        - name: check-publish-flag
          # Gated on `publish = true` in Cargo.toml. Currently all crates are
          # publish = false per the scaffold, so this step is a safe no-op.
          # TODO(release-engineer): flip `publish = ["sunbeam"]` on
          # sunbeam-meet-proto when the first release is cut.
          run: |
            if ! grep -q '^publish = \["sunbeam"\]' crates/sunbeam-meet-proto/Cargo.toml; then
              echo "sunbeam-meet-proto publish disabled; skipping."
              exit 0
            fi
            cargo publish \
              --registry sunbeam \
              -p sunbeam-meet-proto \
              --token "${SUNBEAM_REGISTRY_TOKEN}"

    # ---- Publish migrations crate (tier 2) ----
    publish-migrations:
      needs: [publish-proto]
      if: "startsWith(ref, 'refs/tags/v')"
      steps:
        - name: check-publish-flag
          run: |
            if ! grep -q '^publish = \["sunbeam"\]' crates/sunbeam-meet-migrations/Cargo.toml; then
              echo "sunbeam-meet-migrations publish disabled; skipping."
              exit 0
            fi
            cargo publish \
              --registry sunbeam \
              -p sunbeam-meet-migrations \
              --token "${SUNBEAM_REGISTRY_TOKEN}"

    # ---- Image build + push (tier 3) ----
    image:
      needs: [publish-migrations]
      if: "startsWith(ref, 'refs/tags/v')"
      image: registry.sunbeam.pt/wfe/buildkit:latest
      steps:
        - name: login
          run: |
            echo "${SUNBEAM_REGISTRY_TOKEN}" | \
              buildctl-daemonless.sh --login registry.sunbeam.pt
        - name: build-push
          run: |
            VERSION="${TAG#v}"
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=. \
              --local dockerfile=. \
              --output type=image,\
            name=registry.sunbeam.pt/sunbeam-meet:${VERSION},push=true \
              --output type=image,\
            name=registry.sunbeam.pt/sunbeam-meet:latest,push=true

    # ---- Gitea release with changelog ----
    release:
      needs: [image]
      if: "startsWith(ref, 'refs/tags/v')"
      steps:
        - name: changelog
          run: |
            # Auto-generate from commits since the previous tag.
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD" > CHANGELOG.release.md
            else
              git log --pretty=format:'- %s (%h)' > CHANGELOG.release.md
            fi
        - name: publish
          uses: wfe/gitea-release@v1
          with:
            host: src.sunbeam.pt
            owner: sunbeam
            repo: sunbeam-meet
            tag: "${TAG}"
            name: "sunbeam-meet ${TAG}"
            bodyPath: CHANGELOG.release.md
            token: "${GITEA_RELEASE_TOKEN}"
